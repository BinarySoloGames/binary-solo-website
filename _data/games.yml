- name: Hisato no Saku
  description: >
    Protect your village from those who would do you harm. Play as village 
    elder Hayato, an old warrior, standing guard each day.
    Strangers approach the gate. Decide who comes and goes to ensure your village 
    survives the upcoming winter but watch out, some may not leave without a fight.
    
    
    Made in collaboration with Elder Tree Games.
  cover: /assets/images/HisatoNoSaku.png
- name: Indie Van Game Jam
  description: >
    A YouTube / Game series where we travel around the country, 
    interview independent game developers, and make a game on the way in our van.
    Each episode is a new city, new creator, and an all new game.
  cover: /assets/images/IVGJ.png
- name: Blowfish Meets Meteor
  description: >
    A brick breaking, underwater adventure! It's a block-breaker -- 
    but it quickly dovetails into an insane platformer genre hybrid, 
    where gigantic bosses and ridiculous setpieces are the norm. 
    The title screen dumps you into a relatively simple block-breaking stage -- 
    and then victory whisks you off to a sprawling world map, 
    packed with unique locations and secrets!
    

    We helped bring this one across the finish line.
  cover: /assets/images/BlowfishMeetsMeteor.png